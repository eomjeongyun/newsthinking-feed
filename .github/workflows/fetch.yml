name: fetch-news
on:
  schedule:
    - cron: "0 21,23 * * *"
    - cron: "0 1,3,5,8,11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: re-collect today
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fetch-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      NEWS_KEY: ${{ secrets.NEWS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura cryptography
      - run: python fetch_news.py ${{ inputs.force && '--force' || '' }}
      - name: commit
        run: |
          git config user.name "newsthinking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "news $(date +%F)"
          git push
